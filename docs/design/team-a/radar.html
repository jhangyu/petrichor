<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team A · 雷達回波 — CWA 天氣 mockup</title>
<!--
  Team A「Glanceable dashboard」— 雷達回波頁 (radar)
  Functions covered (page-inventory.md §2, §2.3, §3.1, §0):
   1. 雷達回波疊圖於地圖（全台合成 O-A0058-001、單站 O-A0084-001/002/003）          → 框 1、2
   2. 雷達來源切換：全台合成／樹林／南屯／林園（標籤統一用「樹林」）                → 框 1、2「雷達來源」
   3. 透明度滑桿 10–100%，預設 60%，即時顯示數值                                     → 框 1「疊圖透明度」
   4. 使用者位置標記（地圖上的藍點以外改用 pin 色 token）                              → 框 1、2、6
   5. 回到我的位置（地圖右上浮動鈕）                                                   → 框 1–6（框 7 停用）
   6. 影格時間戳（app bar 副標＋地圖左上「11/14 14:00」標籤＋播放卡）                → 全部框
   6a. 資料來源：每框頁面內容最底部單一來源行（列出本頁資料集）                         → 全部框
   7. dBZ 色階圖例（0–60+，每格標數字與強度文字）                                      → 框 1、2
   8. 動畫播放：影格來自中央氣象署網站帶時間戳雷達圖（每 10 分鐘一張）；上一張／播放暫停／下一張、
      影格滑桿、影格時間軸（預設 24 張 10:10–14:00）                                     → 框 1、2
   8a. 播放設定（可展開）：回看範圍 1／2／4／6／12／24 小時，預設 4 小時＝24 張；播放速度 2／4／8 fps，
      預設 4 fps；重複播放開關（預設開），說明「播放結束後等待 3 秒再重播」              → 框 1（框 2 狀態列同步）
   9. 重新整理（app bar）                                                              → 全部框
  10. 雷達涵蓋範圍說明（全台：臺灣本島及周邊海域；單站範圍虛線圈）                   → 框 1、2
  11. 地圖平移縮放（真實 App 為 flutter_map；mockup 為靜態示意）                      → 框 1
  12. 狀態：雷達圖載入中、連線失敗（含「沒有回波不代表沒下雨」提示）、
      未設定 API 金鑰、無明顯回波（空）、未取得位置權限                               → 框 3–7
  13. 底部導覽 5 頁，目前頁＝雷達                                                      → 全部框
  Data-viz colours: only --dbz-* tokens (tokens-fluent2-light.css, contract §1 exception).
-->
<link rel="stylesheet" href="../tokens-fluent2-light.css">
<link rel="stylesheet" href="../components.css">
<style>
  /* ===== Mockup board (aligned to team-a/home.html) ===== */
  .board { display: flex; flex-direction: column; align-items: center; gap: var(--space-40); padding: var(--space-32) var(--space-16) var(--space-64); }
  .board__head { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: var(--space-8); }
  .board__group { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: var(--space-16); }
  .board__group-title { font-size: var(--type-subtitle1-size); line-height: var(--type-subtitle1-lh); font-weight: var(--type-subtitle1-weight); }
  .frames { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: var(--space-40) var(--space-32); }
  .frame { width: 100%; max-width: 375px; display: flex; flex-direction: column; gap: var(--space-12); }
  .frame__caption { display: flex; align-items: center; gap: var(--space-8); font-size: var(--type-body1-size); line-height: var(--type-body1-lh); font-weight: var(--font-weight-semibold); color: var(--color-fg-2); }
  .frame__note { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .frame .app-shell { min-height: 812px; border: var(--stroke-thin) solid var(--color-stroke-2); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-16); }
  .frame .app-bar, .frame .bottom-nav { position: relative; }
  @media (max-width: 420px) {
    .board { padding-inline: var(--space-0); }
    .board__head, .board__group { padding-inline: var(--space-16); }
    .frames { padding-inline: var(--space-0); }
    .board__group > .frames { margin-inline: calc(-1 * var(--space-16)); }
    .frame .app-shell { border-radius: var(--radius-none); border-inline: none; }
    .frame__caption, .frame__note { padding-inline: var(--space-16); }
  }

  /* ===== Team A shared patterns (app bar subtitle, hero, cards) — same as home.html ===== */
  .app-bar__subtitle { display: flex; align-items: center; gap: var(--space-4); }
  .app-bar__subtitle .icon { color: var(--color-brand-fg); }
  .page--a { gap: var(--space-16); padding-top: var(--space-8); }
  .hero { background: linear-gradient(180deg, var(--color-brand-160) 0%, var(--color-bg-1) 64%); box-shadow: var(--shadow-8); }
  .hero__eyebrow { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); }
  .page-foot { text-align: center; font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .hero .metric { background: var(--color-bg-1); border: var(--stroke-thin) solid var(--color-stroke-3); }
  .card--a { border-radius: var(--radius-lg); padding: var(--space-16) var(--space-16) var(--space-20); gap: var(--space-16); }
  .card--a .card__title { font-size: var(--type-subtitle1-size); line-height: var(--type-subtitle1-lh); font-weight: var(--type-subtitle1-weight); }
  .card--a.card--flush { padding: var(--space-0); gap: var(--space-0); }
  .hero__titles { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }

  /* ---- Map (stylised Taiwan placeholder) ---- */
  .radar-map { aspect-ratio: 5 / 6; border-radius: var(--radius-md); }
  .map-svg { width: 100%; height: 100%; }
  .map-land { fill: var(--color-map-land); stroke: var(--color-map-border); stroke-width: 1.5; stroke-linejoin: round; }
  .map-range { fill: none; stroke: var(--color-brand-stroke); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .map-station { fill: var(--color-brand-bg); stroke: var(--color-bg-1); stroke-width: 1.5; }
  .me__halo { fill: var(--color-map-pin); opacity: 0.2; }
  .me__dot { fill: var(--color-map-pin); stroke: var(--color-bg-1); stroke-width: 2; }
  .echo-0 { fill: var(--dbz-0); } .echo-10 { fill: var(--dbz-10); } .echo-20 { fill: var(--dbz-20); }
  .echo-30 { fill: var(--dbz-30); } .echo-40 { fill: var(--dbz-40); } .echo-50 { fill: var(--dbz-50); }
  .map-chip { position: absolute; top: var(--space-12); left: var(--space-12); display: inline-flex; align-items: center; gap: var(--space-4); min-height: var(--size-control-sm); padding: var(--space-4) var(--space-12); border-radius: var(--radius-circular); background: var(--color-bg-overlay); box-shadow: var(--shadow-4); font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); font-weight: var(--font-weight-semibold); font-variant-numeric: tabular-nums; }
  .map-fabs { position: absolute; top: var(--space-12); right: var(--space-12); display: flex; flex-direction: column; gap: var(--space-8); }
  .fab[aria-disabled="true"] { color: var(--color-fg-disabled); box-shadow: var(--shadow-2); cursor: not-allowed; }
  .map-center { position: absolute; inset: var(--space-0); display: flex; align-items: center; justify-content: center; padding: var(--space-16); }
  .map-center .map-chip { position: static; gap: var(--space-8); min-height: var(--size-touch); padding: var(--space-8) var(--space-16); font-size: var(--type-body1-size); line-height: var(--type-body1-lh); }
  /* Playback settings (expandable, Team A card-in-card on bg-2) */
  .pb-settings { border-radius: var(--radius-md); background: var(--color-bg-2); border: var(--stroke-thin) solid var(--color-stroke-3); }
  .pb-settings__summary { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); min-height: var(--size-touch); padding: var(--space-0) var(--space-12); cursor: pointer; list-style: none; }
  .pb-settings__summary::-webkit-details-marker { display: none; }
  .pb-settings__title { display: flex; align-items: center; gap: var(--space-8); font-size: var(--type-body1-size); line-height: var(--type-body1-lh); font-weight: var(--font-weight-semibold); flex: none; white-space: nowrap; }
  .pb-settings__state { display: flex; align-items: center; gap: var(--space-4); min-width: 0; font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); font-variant-numeric: tabular-nums; }
  .pb-settings__state-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pb-settings__chev { flex: none; transition: transform var(--duration-normal) var(--curve-easy-ease); }
  .pb-settings[open] .pb-settings__chev { transform: rotate(90deg); }
  .pb-settings__body { display: flex; flex-direction: column; gap: var(--space-16); padding: var(--space-4) var(--space-12) var(--space-16); }
  .pb-field { display: flex; flex-direction: column; gap: var(--space-8); min-width: 0; }
  .pb-field__label { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); font-weight: var(--font-weight-semibold); color: var(--color-fg-2); }
  .segmented--block { display: flex; }
  .segmented--block .segmented__item { flex: 1; }
  .pb-toggle { display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); min-height: var(--size-touch); }
  .pb-toggle__text { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
  .switch { position: relative; flex: none; width: var(--space-40); height: var(--space-24); padding: var(--space-0); border: none; border-radius: var(--radius-circular); background: var(--color-stroke-accessible); transition: background-color var(--duration-fast) var(--curve-easy-ease); }
  .switch[aria-checked="true"] { background: var(--color-brand-bg); }
  .switch__thumb { position: absolute; top: var(--space-4); left: var(--space-4); width: var(--space-16); height: var(--space-16); border-radius: var(--radius-circular); background: var(--color-bg-1); box-shadow: var(--shadow-2); transition: transform var(--duration-fast) var(--curve-easy-ease); }
  .switch[aria-checked="true"] .switch__thumb { transform: translateX(var(--space-16)); }
  .map-hint { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .radar-map--muted .map-svg { opacity: 0.6; }

  /* ---- Legend with intensity words under each number ---- */
  .legend__words { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: var(--type-caption2-size); line-height: var(--type-caption2-lh); color: var(--color-fg-3); }

  /* ---- Playback: past-frame timeline scroller ---- */
  .timeline { gap: var(--space-8); }
  .tl-frame { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); min-width: var(--size-icon-48); min-height: var(--size-touch); padding: var(--space-8) var(--space-8); border: var(--stroke-thin) solid var(--color-stroke-2); border-radius: var(--radius-md); background: var(--color-bg-1); color: var(--color-fg-2); font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); font-variant-numeric: tabular-nums; }
  .tl-frame__bar { width: var(--size-icon-24); height: var(--size-slider-track); border-radius: var(--radius-circular); }
  .tl-frame[aria-current="true"] { background: var(--color-brand-bg-subtle); border-color: var(--color-brand-stroke); color: var(--color-brand-fg-strong); font-weight: var(--font-weight-semibold); }
  .playback__controls .btn:disabled { background: transparent; }
  .playback__play:disabled { background: var(--color-bg-disabled); }

  /* ---- Note row (coverage) ---- */
  .note { display: flex; align-items: flex-start; gap: var(--space-12); color: var(--color-fg-2); }
  .note .icon { color: var(--color-brand-fg); }
  .note__body { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
  .skel-line { height: var(--space-12); min-height: var(--space-12); }
  .skel-line--title { height: var(--space-24); width: 70%; }
  .skel-line--short { width: 45%; }
</style>
</head>
<body>

<main class="board">

<header class="board__head">
  <h1 class="text-title2">Team A · 雷達回波</h1>
  <p class="text-secondary">英雄卡＝目前回波摘要＋地圖；下方依序為播放、來源、透明度、涵蓋範圍卡。後續各框為切換來源與各種狀態。</p>
</header>

<section class="board__group" aria-labelledby="g-default">
  <h2 class="board__group-title" id="g-default">預設狀態與其他狀態</h2>
  <div class="frames">

  <!-- ================= Frame 1: default ================= -->
  <figure class="frame">
    <figcaption class="frame__caption">① 全台合成 · 最新影格（暫停）<span class="badge badge--brand">預設</span></figcaption>
    <div class="app-shell">
      <header class="app-bar">
        <div class="app-bar__titles">
          <p class="app-bar__title">雷達回波</p>
          <p class="app-bar__subtitle num"><svg class="icon icon--16" aria-hidden="true"><use href="#i-clock"/></svg>觀測 2026-11-14 14:00 · 每 10 分鐘更新</p>
        </div>
        <div class="app-bar__actions">
          <button class="btn btn--subtle btn--icon" aria-label="重新整理"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
        </div>
      </header>
      <div class="page page--a">
        <article class="card card--hero hero" aria-label="目前雷達回波">
          <div class="hero__titles">
            <p class="hero__eyebrow"><span class="text-caption1 text-tertiary">全台合成回波</span></p>
            <p class="text-subtitle1">北部、東北部有強回波</p>
            <p class="card__meta">最強約 45 dBZ（橙）· 臺北市 信義區附近 30–40 dBZ</p>
          </div>
          <div class="map radar-map" role="img" aria-label="雷達回波地圖：北部及東北部有 20 至 50 dBZ 回波，目前位置在臺北市信義區">
            <svg class="map-svg" viewBox="30 40 250 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <use href="#tw-land" class="map-land"/>
              <g class="echoes" style="opacity:0.6">
                <ellipse class="echo-0" cx="262" cy="150" rx="20" ry="32"/>
                <ellipse class="echo-10" cx="262" cy="150" rx="11" ry="20"/>
                <ellipse class="echo-0" cx="160" cy="182" rx="20" ry="30"/>
                <ellipse class="echo-10" cx="162" cy="186" rx="9" ry="14"/>
                <g transform="rotate(-25 218 90)">
                  <ellipse class="echo-0" cx="220" cy="92" rx="48" ry="32"/>
                  <ellipse class="echo-10" cx="218" cy="90" rx="36" ry="22"/>
                  <ellipse class="echo-20" cx="214" cy="88" rx="25" ry="15"/>
                  <ellipse class="echo-30" cx="217" cy="90" rx="14" ry="8"/>
                  <ellipse class="echo-40" cx="221" cy="93" rx="7" ry="4.5"/>
                  <ellipse class="echo-50" cx="223" cy="94" rx="2.5" ry="2"/>
                </g>
              </g>
              <circle class="me__halo" cx="205" cy="77" r="10"/>
              <circle class="me__dot" cx="205" cy="77" r="4.5"/>
            </svg>
            <span class="map-chip"><svg class="icon icon--16" aria-hidden="true"><use href="#i-clock"/></svg>11/14 14:00</span>
            <div class="map-fabs">
              <button class="fab" aria-label="回到我的位置"><svg class="icon" aria-hidden="true"><use href="#i-locate"/></svg></button>
            </div>
          </div>
          <div class="legend" aria-label="雷達回波強度圖例">
            <div class="row" style="justify-content:space-between"><span class="legend__title">回波強度</span><span class="legend__unit">dBZ</span></div>
            <div class="legend__bar" aria-hidden="true"><span class="dbz-0"></span><span class="dbz-10"></span><span class="dbz-20"></span><span class="dbz-30"></span><span class="dbz-40"></span><span class="dbz-50"></span><span class="dbz-60"></span></div>
            <div class="legend__labels num"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60+</span></div>
            <div class="legend__words"><span>微弱</span><span>小雨</span><span>中雨</span><span>大雨</span><span>豪雨</span><span>強降雨</span><span>冰雹</span></div>
          </div>
        </article>

        <article class="card card--a" aria-label="雷達動畫播放">
          <div class="card__header"><h2 class="card__title">動畫播放</h2><span class="card__meta">過去 4 小時 · 24 張</span></div>
          <div class="playback__time">
            <span class="playback__timestamp">11/14 14:00</span>
            <span class="playback__frame">第 24 / 24 張 · 最新</span>
          </div>
          <div class="playback__controls">
            <button class="btn btn--subtle btn--icon" aria-label="上一張"><svg class="icon icon--20" aria-hidden="true"><use href="#i-prev"/></svg></button>
            <button class="btn btn--icon playback__play" aria-label="播放"><svg class="icon icon--20" aria-hidden="true"><use href="#i-play"/></svg></button>
            <button class="btn btn--subtle btn--icon" aria-label="下一張" disabled><svg class="icon icon--20" aria-hidden="true"><use href="#i-next"/></svg></button>
            <input class="slider__input" type="range" min="1" max="24" value="24" aria-label="影格時間" style="--fill:100%">
          </div>

<script>
  // Timeline opens on the newest frame (aria-current), matching the default "第 24 / 24 張"
  document.querySelectorAll('.timeline').forEach(function (t) { t.scrollLeft = t.scrollWidth; });
  // Opacity slider: live value + overlay opacity (mockup interaction only)
  document.querySelectorAll('[data-opacity]').forEach(function (input) {
    var shell = input.closest('.app-shell');
    input.addEventListener('input', function () {
      var v = Number(input.value);
      shell.querySelector('[data-opacity-out]').textContent = v + '%';
      input.style.setProperty('--fill', ((v - 10) / 90 * 100) + '%');
      shell.querySelectorAll('.echoes').forEach(function (g) { g.style.opacity = v / 100; });
    });
  });
</script>
