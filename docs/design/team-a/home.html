<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team A · 天氣主頁 — CWA 天氣 mockup</title>
<!--
  Team A「Glanceable dashboard」— 天氣主頁 (home)。Team A 參考檔：其他頁面對齊本檔的
  app bar、hero 卡、section 標題、卡片 (radius-lg + shadow) 與 frame 標註樣式。

  本頁涵蓋的功能（docs/design/preflight/page-inventory.md §1）：
  1. 位置標題列：地名「臺北市 信義區」、定位狀態（目前位置／預設地點）、切換地點動作（→ location.html）
  2. 最後更新時間（app bar 副標 + 下拉提示列）
  3. 重新整理：app bar 重新整理按鈕 + 下拉重新整理提示（§1.1 下拉重新整理）
  4. 目前天氣（即時觀測 §3.6）：溫度、天氣現象（圖示隨現象變化）、體感、濕度、風速風向、降雨機率
  5. 今日高低溫（真實 min/max，不再用「高溫−2」）
  6. 未來 72 小時預報（F-D0047-061 鄉鎮 3 天）：發布時間、摘要列（72 小時最高/最低溫、最大降雨機率時段）、
     橫向捲動圖：溫度折線（逐時點，間距不均依時間定位）＋體感虛線、每 3 小時天氣圖示／降雨機率長條／風向風速，
     今天/明天/後天日界線與日期、「現在」標記；數值皆以文字標示；載入骨架、僅此區塊失敗的變體
  7. 日出日落（72 小時預報之前）：今天日出／日落時刻、白晝長度、太陽弧線標出「現在」位置與距日落時間、
     曙光／過中天（仰角）／暮光次列（與主列同三欄中心）、明天日出日落（A-B0062-001）；數值皆以文字標示；載入骨架
  8. 7 日預報（日期/星期、天氣圖示、降雨機率、低溫/高溫 + 溫度區間條、今日目前溫度標記）
  9. 生效中警特報入口橫幅（大雨特報 → warnings.html，§3.5）
  10. 雷達入口（底部導覽 → radar.html）、雨量入口（→ rainfall.html）
  11. 狀態：載入中（skeleton + spinner）、錯誤（可讀原因 + 重試）、無資料（原因 + 換地點/重試）、
      定位權限被拒（顯示預設地點並提示，前往設定／手動選地點）
  底部導覽順序：天氣 | 雷達 | 雨量 | 警特報 | 地點
  資料來源：每個有資料的 frame 只在內容最底（底部導覽上方）列一行，資料集列一次：
  O-A0003-001 即時觀測、F-D0047-061 鄉鎮 3 天、F-D0047-063 鄉鎮 1 週、A-B0062-001 日出日沒、W-C0033-001/002 警特報；卡片內不再各自標示。
-->
<link rel="stylesheet" href="../tokens-fluent2-light.css">
<link rel="stylesheet" href="../components.css">
<style>
  /* ===== Mockup board (frames side by side, centred) ===== */
  .board {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-40);
    padding: var(--space-32) var(--space-16) var(--space-64);
  }
  .board__head { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: var(--space-8); }
  .board__group { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: var(--space-16); }
  .board__group-title { font-size: var(--type-subtitle1-size); line-height: var(--type-subtitle1-lh); font-weight: var(--type-subtitle1-weight); }
  .frames { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: var(--space-40) var(--space-32); }

  /* Phone frame: 375px primary width, caption above */
  .frame { width: 100%; max-width: 375px; display: flex; flex-direction: column; gap: var(--space-12); }
  .frame__caption { display: flex; align-items: center; gap: var(--space-8); font-size: var(--type-body1-size); line-height: var(--type-body1-lh); font-weight: var(--font-weight-semibold); color: var(--color-fg-2); }
  .frame__caption .badge { font-weight: var(--font-weight-semibold); }
  .frame__note { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .frame .app-shell {
    min-height: 812px; /* iPhone-class viewport height */
    border: var(--stroke-thin) solid var(--color-stroke-2);
    border-radius: var(--shape-medium);
    overflow: hidden;
    box-shadow: var(--shadow-16);
  }
  /* Bars are static inside a frame (no page-level sticking across frames) */
  .frame .app-bar, .frame .bottom-nav { position: relative; }
  @media (max-width: 420px) {
    .board { padding-inline: var(--space-0); }
    .board__head, .board__group { padding-inline: var(--space-16); }
    .frames { padding-inline: var(--space-0); }
    .board__group > .frames { margin-inline: calc(-1 * var(--space-16)); }
    .frame .app-shell { border-radius: var(--shape-none); border-inline: none; }
    .frame__caption, .frame__note { padding-inline: var(--space-16); }
  }

  /* ===== Team A app bar: location title is the change-location action ===== */
  .loc-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-4);
    max-width: 100%;
    min-height: var(--size-control-sm);
    padding: var(--space-0);
    border: none;
    background: transparent;
    color: var(--color-fg-1);
    text-decoration: none;
    border-radius: var(--shape-extra-small);
  }
  .loc-btn:hover { color: var(--color-brand-fg); }
  .loc-btn .app-bar__title { color: inherit; }
  .loc-btn__chev { transform: rotate(90deg); color: var(--color-fg-3); }
  .app-bar__subtitle { display: flex; align-items: center; gap: var(--space-4); }
  .app-bar__subtitle .icon { color: var(--color-brand-fg); }
  .app-bar__subtitle--warn .icon { color: var(--color-warning-fg); }

  /* ===== Pull-to-refresh hint ===== */
  .ptr {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-8);
    min-height: var(--size-control-sm);
    font-size: var(--type-caption1-size);
    line-height: var(--type-caption1-lh);
    color: var(--color-fg-3);
  }
  .ptr__arrow { transform: rotate(90deg); }
  .ptr--active { color: var(--color-brand-fg-strong); }
  .ptr__pill {
    display: inline-flex;
    align-items: center;
    gap: var(--space-8);
    padding: var(--space-4) var(--space-12);
    background: var(--color-bg-1);
    border-radius: var(--shape-full);
    box-shadow: var(--shadow-4);
  }

  /* Team A page rhythm: tighter top (pull hint sits in the gap) */
  .page--a { gap: var(--space-16); padding-top: var(--space-8); }

  /* ===== Hero: current observation ===== */
  .hero {
    background: linear-gradient(180deg, var(--color-brand-160) 0%, var(--color-bg-1) 64%);
    box-shadow: var(--shadow-8);
  }
  .hero__eyebrow { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); }
  .hero__main { display: flex; align-items: center; justify-content: space-between; gap: var(--space-16); }
  .hero__temp { display: flex; flex-direction: column; gap: var(--space-0); min-width: 0; }
  .hero__temp .text-display { color: var(--color-fg-1); }
  .hero__cond { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); text-align: center; }
  .hero__hilo { display: flex; align-items: center; gap: var(--space-12); font-size: var(--type-body2-size); line-height: var(--type-body2-lh); font-weight: var(--font-weight-semibold); }
  .hero__hilo span { display: inline-flex; align-items: center; gap: var(--space-4); }
  .hero__hilo .lbl { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); font-weight: var(--font-weight-regular); color: var(--color-fg-3); }
  .hero .metric { background: var(--color-bg-1); border: var(--stroke-thin) solid var(--color-stroke-3); }
  .hero__summary {
    display: flex;
    align-items: center;
    gap: var(--space-8);
    padding: var(--space-8) var(--space-12);
    border-radius: var(--shape-small);
    background: var(--color-rain-bg);
    color: var(--color-rain-fg);
    font-size: var(--type-body1-size);
    line-height: var(--type-body1-lh);
  }

  /* ===== Team A cards: largest radius, shadow elevation ===== */
  .card--a { border-radius: var(--shape-medium); padding: var(--space-16) var(--space-16) var(--space-20); gap: var(--space-16); }
  .card--a .card__title { font-size: var(--type-subtitle1-size); line-height: var(--type-subtitle1-lh); font-weight: var(--type-subtitle1-weight); }

  /* Warning entry banner (link) */
  .warn-entry { text-decoration: none; align-items: center; border-radius: var(--shape-medium); box-shadow: var(--shadow-2); }
  .warn-entry .status-banner__title { color: var(--color-alert-1-fg); }
  .warn-entry .status-banner__text { color: var(--color-fg-2); }
  .warn-entry__chev { flex: none; color: var(--color-alert-1-fg); }

  /* 72-hour forecast: summary row + horizontally scrollable chart (SVG coordinates on a 4/8 px grid) */
  .fc72__summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-8); }
  .fc72__stat { display: flex; flex-direction: column; gap: var(--space-0); padding: var(--space-8); background: var(--color-bg-2); border: var(--stroke-thin) solid var(--color-stroke-3); border-radius: var(--shape-small); min-width: 0; }
  .fc72__stat-label, .fc72__stat-sub { white-space: nowrap; }
  .fc72__stat-label { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .fc72__stat-value { font-size: var(--type-subtitle1-size); line-height: var(--type-subtitle1-lh); font-weight: var(--font-weight-semibold); }
  .fc72__stat-sub { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-2); }
  .fc72__chart { display: flex; align-items: flex-start; gap: var(--space-0); }
  .fc72__axis { flex: none; }
  .fc72__scroll { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: thin; border-radius: var(--shape-extra-small); }
  .fc72__svg { max-width: none; }
  .fc-t { font-family: var(--font-family-base); font-variant-numeric: tabular-nums; font-size: var(--type-caption2-size); fill: var(--color-fg-2); }
  .fc-t--axis { font-size: var(--type-caption1-size); fill: var(--color-fg-3); }
  .fc-t--day { font-size: var(--type-caption1-size); font-weight: var(--font-weight-semibold); fill: var(--color-fg-1); }
  .fc-t--now { font-size: var(--type-caption1-size); font-weight: var(--font-weight-semibold); fill: var(--color-brand-fg); }
  .fc-t--slot { font-size: var(--type-caption1-size); fill: var(--color-fg-2); }
  .fc-t--tick { fill: var(--color-fg-4); }
  .fc-tick-axis, .fc-tick { stroke: var(--color-stroke-1); stroke-width: 1; }
  /* halo so the dashed day divider never strikes through edge-aligned labels */
  .fc-t--temp, .fc-t--at, .fc-t--tick { paint-order: stroke; stroke: var(--color-bg-1); stroke-width: 4px; stroke-linejoin: round; }
  .fc-t--temp { font-size: var(--type-caption1-size); font-weight: var(--font-weight-semibold); fill: var(--color-fg-1); }
  .fc-t--at { fill: var(--color-fg-3); }
  .fc-t--pop { font-weight: var(--font-weight-semibold); fill: var(--color-rain-fg); }
  .fc-t--pop-low { font-weight: var(--font-weight-regular); fill: var(--color-fg-3); }
  .fc-icon { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .fc-now { stroke: var(--color-brand-fg); stroke-width: 2; }
  .fc-day { stroke: var(--color-stroke-1); stroke-width: 1; stroke-dasharray: 4 4; }
  .fc-temp { fill: none; stroke: var(--color-warning-fg); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .fc-at { fill: none; stroke: var(--color-fg-4); stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linejoin: round; }
  .fc-dot { fill: var(--color-bg-1); stroke: var(--color-warning-fg); stroke-width: 2; }
  .fc-dot--minor { fill: var(--color-warning-fg); stroke: none; }
  .fc-track { fill: var(--color-rain-bar-track); }
  .fc-pop { fill: var(--color-rain-bar); }
  .fc72__legend { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4) var(--space-16); font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .fc72__legend > span { display: inline-flex; align-items: center; gap: var(--space-4); }
  .fc72__hint { margin-left: auto; }
  .fc72__key { width: var(--size-icon-16); height: var(--stroke-thick); border-radius: var(--shape-full); background: var(--color-warning-fg); }
  .fc72__key--at { height: var(--space-0); border-top: var(--stroke-thick) dashed var(--color-fg-4); background: none; border-radius: var(--shape-none); }
  .fc72__key--pop { height: var(--size-dot); width: var(--size-dot); border-radius: var(--shape-extra-small); background: var(--color-rain-bar); }

  /* Sunrise / sunset card */
  .sun__arc { width: 100%; height: auto; }
  .sun__horizon { stroke: var(--color-stroke-2); stroke-width: 1.5; }
  .sun__path-done { fill: none; stroke: var(--color-icon-sun); stroke-width: 3; stroke-linecap: round; }
  .sun__twilight { fill: none; stroke: var(--color-icon-sun); stroke-width: 2; stroke-opacity: 0.4; stroke-dasharray: 2 3; }
  .sun__twi { fill: var(--color-bg-1); stroke: var(--color-fg-4); stroke-width: 1.5; }
  .sun__transit { fill: var(--color-bg-1); stroke: var(--color-icon-sun); stroke-width: 2; }
  /* transit label: HTML over the scaling SVG so it never drops below the caption size; x = transit point (143.8/288), top = just under the arc top (24/112) */
  .sun__arc-wrap { position: relative; }
  .sun__arc-label { position: absolute; left: 49.93%; top: 21.43%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-2); white-space: nowrap; }
  .sun__times--sub { margin-top: var(--space-0); }
  .sun__value.sun__value--minor { font-size: var(--type-body1-size); line-height: var(--type-body1-lh); color: var(--color-fg-2); }
  .sun__path-left { fill: none; stroke: var(--color-stroke-1); stroke-width: 2; stroke-dasharray: 4 4; }
  .sun__end { fill: var(--color-bg-1); stroke: var(--color-fg-3); stroke-width: 1.5; }
  .sun__now { fill: var(--color-icon-sun); stroke: var(--color-bg-1); stroke-width: 3; }
  .sun__times { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-0); margin-top: calc(-1 * var(--space-8)); }
  .sun__time { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-0); min-width: 0; }
  .sun__label { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); white-space: nowrap; }
  .sun__value { font-size: var(--type-subtitle1-size); line-height: var(--type-subtitle1-lh); font-weight: var(--font-weight-semibold); white-space: nowrap; }
  .sun__value--sub { font-size: var(--type-body1-size); line-height: var(--type-subtitle1-lh); color: var(--color-fg-2); }
  .sun__now-line { display: flex; align-items: center; justify-content: center; gap: var(--space-4); font-size: var(--type-body1-size); line-height: var(--type-body1-lh); color: var(--color-fg-1); }
  .sun__now-line .icon { color: var(--color-brand-fg); }
  .sun__tomorrow { padding-top: var(--space-12); border-top: var(--stroke-thin) solid var(--color-stroke-3); font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-2); }
  .skeleton--arc { height: 112px; border-radius: var(--shape-small); }

  /* 7-day rows: fixed numeric columns so values align */
  .days { display: flex; flex-direction: column; }
  .day {
    display: grid;
    grid-template-columns: 64px 24px 36px 28px minmax(0, 1fr) 28px;
    align-items: center;
    gap: var(--space-8);
    min-height: 56px;
    padding: var(--space-8) var(--space-0);
  }
  .day + .day { border-top: var(--stroke-thin) solid var(--color-stroke-3); }
  .day__name { display: flex; flex-direction: column; min-width: 0; }
  .day__label { font-size: var(--type-body1-size); line-height: var(--type-body1-lh); font-weight: var(--font-weight-semibold); }
  .day__date { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .day__rain { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); font-weight: var(--font-weight-semibold); color: var(--color-rain-fg); text-align: right; }
  .day__rain--low { color: var(--color-fg-3); font-weight: var(--font-weight-regular); }
  .day__lo { text-align: right; color: var(--color-fg-3); }
  .day__hi { text-align: left; font-weight: var(--font-weight-semibold); }
  .day .temp-range { min-width: 0; }
  .temp-range__now {
    position: absolute;
    top: 50%;
    width: var(--size-dot);
    height: var(--size-dot);
    border-radius: var(--shape-full);
    background: var(--color-bg-1);
    border: var(--stroke-thick) solid var(--color-fg-1);
    transform: translate(-50%, -50%);
  }
  .days__legend { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .days__legend span { display: inline-flex; align-items: center; gap: var(--space-4); }
  .days__legend .temp-range__now { position: static; transform: none; flex: none; }

  .page-foot { text-align: center; font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }

  /* ===== State frames ===== */
  .sk-hero { display: flex; flex-direction: column; gap: var(--space-16); }
  .sk-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-16); }
  .sk-col { display: flex; flex-direction: column; gap: var(--space-8); flex: 1; }
  .skeleton--display { height: var(--size-icon-64); width: 128px; border-radius: var(--shape-small); }
  .skeleton--line { width: 60%; }
  .skeleton--short { width: 40%; }
  .skeleton--circle { width: var(--size-icon-64); height: var(--size-icon-64); border-radius: var(--shape-full); flex: none; }
  .skeleton--tile { height: 52px; border-radius: var(--shape-extra-small); }
  .skeleton--chart { height: 340px; border-radius: var(--shape-small); }
  .state-card { border-radius: var(--shape-medium); }
  .state-card .empty-state { padding: var(--space-32) var(--space-16) var(--space-24); }
  .empty-state__text { font-size: var(--type-body1-size); line-height: var(--type-body1-lh); color: var(--color-fg-2); }
  .empty-state__actions { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-8); padding-top: var(--space-8); }
  .empty-state__icon--error { color: var(--color-danger-fg); }
  .perm-banner { border-radius: var(--shape-medium); }
  .badge--default-loc { background: var(--color-warning-bg); color: var(--color-warning-fg); border-color: var(--color-warning-stroke); }
</style>
</head>
<body>

<!-- ===== Icon sprite (copied from ../components.html) ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/><circle cx="12" cy="12" r="0.75"/></symbol>
