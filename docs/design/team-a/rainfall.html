<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team A · 雨量 — CWA 天氣 mockup</title>
<!--
  Team A「Glanceable dashboard」— 雨量頁 (rainfall)，分頁：雨量觀測／降雨預測
  Functions covered (page-inventory.md §3.3, §3.4, §0):
   1. 分頁切換：雨量觀測／降雨預測（頁首分段控制，role=tablist）                       → 框 1、2
   2. 雨量觀測 O-A0002-001：目前位置最近測站今日累積雨量（英雄卡）、近 1／3 小時、
      觀測時間、與豪雨門檻距離                                                             → 框 1
   3. 測站今日累積雨量列表：站名、縣市區、累積 mm、等級徽章、比例條                      → 框 1
   4. 排序（雨量高→低／站名）與縣市篩選 chip                                             → 框 1、5
   5. 累積雨量圖 O-A0040-002（臺灣示意圖＋等級色＋測站點＋圖例）                         → 框 1
   6. 降雨預測：未來 1 小時 F-B0046-001，我的位置預估 mm（英雄卡）                       → 框 2
   7. 降雨預測：未來 1 小時雨量網格圖 F-B0046-001（臺灣示意圖＋網格色階＋圖例；24 小時預測依使用者裁決移除） → 框 2
   8. 警戒等級配色：大雨 ≥80／豪雨 ≥200／大豪雨 ≥350／超大豪雨 ≥500 mm（24 小時累積），
      用 --color-alert-1…4 token；等級一律配文字，不只靠顏色                                → 框 1、6
   9. 重新整理、更新時間                                                                    → 全部框
   9a. 資料來源：每框頁面內容最底部單一來源行（列出本頁資料集）                         → 全部框
  10. 狀態：載入中、錯誤（連線逾時＋重試）、空（篩選後無測站）、未取得位置權限          → 框 3–6
  11. 底部導覽 5 頁，目前頁＝雨量                                                          → 全部框
  Colours: tokens only (alert levels, rain, brand ramp). No data-viz literals.
-->
<link rel="stylesheet" href="../tokens-fluent2-light.css">
<link rel="stylesheet" href="../components.css">
<style>
  /* ===== Mockup board (aligned to team-a/home.html) ===== */
  .board { display: flex; flex-direction: column; align-items: center; gap: var(--space-40); padding: var(--space-32) var(--space-16) var(--space-64); }
  .board__head { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: var(--space-8); }
  .board__group { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: var(--space-16); }
  .board__group-title { font-size: var(--type-subtitle1-size); line-height: var(--type-subtitle1-lh); font-weight: var(--type-subtitle1-weight); }
  .frames { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: var(--space-40) var(--space-32); }
  .frame { width: 100%; max-width: 375px; display: flex; flex-direction: column; gap: var(--space-12); }
  .frame__caption { display: flex; align-items: center; gap: var(--space-8); font-size: var(--type-body1-size); line-height: var(--type-body1-lh); font-weight: var(--font-weight-semibold); color: var(--color-fg-2); }
  .frame__note { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .frame .app-shell { min-height: 812px; border: var(--stroke-thin) solid var(--color-stroke-2); border-radius: var(--shape-medium); overflow: hidden; box-shadow: var(--shadow-16); }
  .frame .app-bar, .frame .bottom-nav { position: relative; }
  @media (max-width: 420px) {
    .board { padding-inline: var(--space-0); }
    .board__head, .board__group { padding-inline: var(--space-16); }
    .frames { padding-inline: var(--space-0); }
    .board__group > .frames { margin-inline: calc(-1 * var(--space-16)); }
    .frame .app-shell { border-radius: var(--shape-none); border-inline: none; }
    .frame__caption, .frame__note { padding-inline: var(--space-16); }
  }

  /* ===== Team A shared patterns (app bar subtitle, hero, cards) — same as home.html ===== */
  .app-bar__subtitle { display: flex; align-items: center; gap: var(--space-4); }
  .app-bar__subtitle .icon { color: var(--color-brand-fg); }
  .page--a { gap: var(--space-16); padding-top: var(--space-8); }
  .hero { background: linear-gradient(180deg, var(--color-brand-160) 0%, var(--color-bg-1) 64%); box-shadow: var(--shadow-8); }
  .hero__eyebrow { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); }
  .page-foot { text-align: center; font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .hero .metric { background: var(--color-bg-1); border: var(--stroke-thin) solid var(--color-stroke-3); }
  .card--a { border-radius: var(--shape-medium); padding: var(--space-16) var(--space-16) var(--space-20); gap: var(--space-16); }
  .card--a .card__title { font-size: var(--type-subtitle1-size); line-height: var(--type-subtitle1-lh); font-weight: var(--type-subtitle1-weight); }
  .card--a.card--flush { padding: var(--space-0); gap: var(--space-0); }
  .hero__titles { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
  .hero__value { display: flex; align-items: baseline; gap: var(--space-8); }
  .hero__unit { font-size: var(--type-subtitle1-size); line-height: var(--type-subtitle1-lh); font-weight: var(--font-weight-semibold); color: var(--color-fg-2); }
  .card__header--top { align-items: flex-start; }
  .metric__value { white-space: nowrap; } /* keep number + unit together at 320px */
  .card__title--nowrap { white-space: nowrap; }

  /* View switcher: full-width segmented control (Team A uses segmented, not pivot tabs) */
  .segmented--block { display: flex; }
  .segmented--block .segmented__item { flex: 1; }
  .segmented__item[aria-selected="true"] { background: var(--color-bg-1); color: var(--color-fg-1); font-weight: var(--font-weight-semibold); box-shadow: var(--shadow-2); }

  /* Warning-level threshold scale (0 / 80 / 200 / 350 / 500 mm) */
  .thr { display: flex; flex-direction: column; gap: var(--space-4); }
  .thr__track { position: relative; }
  .thr__bar, .thr__labels { display: grid; grid-template-columns: 16fr 24fr 30fr 30fr; }
  .thr__bar { height: var(--size-legend-bar); border-radius: var(--shape-full); overflow: hidden; }
  .thr__marker { position: absolute; top: calc(-1 * var(--space-4)); width: var(--stroke-thicker); height: var(--space-16); border-radius: var(--shape-full); background: var(--color-fg-1); box-shadow: 0 0 0 var(--stroke-thin) var(--color-bg-1); transform: translateX(-50%); }
  .thr__labels { font-size: var(--type-caption2-size); line-height: var(--type-caption2-lh); color: var(--color-fg-3); font-variant-numeric: tabular-nums; }

  /* Level fills (alert tokens; level 0 = rain without warning) */
  .lv-0 { background: var(--color-brand-140); }
  .lv-1 { background: var(--color-alert-1-solid); }
  .lv-2 { background: var(--color-alert-2-solid); }
  .lv-3 { background: var(--color-alert-3-solid); }
  .lv-4 { background: var(--color-alert-4-solid); }
  .rf-0 { fill: var(--color-brand-140); } .rf-1 { fill: var(--color-alert-1-solid); }
  .rf-2 { fill: var(--color-alert-2-solid); } .rf-3 { fill: var(--color-alert-3-solid); }
  .stn { stroke: var(--color-bg-1); stroke-width: 1.5; }

  /* Map */
  .rain-map { aspect-ratio: 5 / 6; border-radius: var(--shape-small); }
  .map-svg { width: 100%; height: 100%; }
  .map-land { fill: var(--color-map-land); stroke: var(--color-map-border); stroke-width: 1.5; stroke-linejoin: round; }
  .map-cover { stroke: var(--color-map-border); stroke-width: 1.5; stroke-linejoin: round; fill: none; }
  .me__halo { fill: var(--color-map-pin); opacity: 0.2; }
  .me__dot { fill: var(--color-map-pin); stroke: var(--color-bg-1); stroke-width: 2; }

  /* Station rows */
  .stn-row .list-row__content { gap: var(--space-4); }
  .stn-row__bar { height: var(--size-slider-track); border-radius: var(--shape-full); background: var(--color-bg-4); overflow: hidden; }
  .stn-row__fill { display: block; height: 100%; border-radius: var(--shape-full); }
  .stn-row__value { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-4); min-width: var(--size-icon-64); }
  .stn-row__mm { font-size: var(--type-body2-size); line-height: var(--type-body2-lh); font-weight: var(--font-weight-semibold); color: var(--color-fg-1); font-variant-numeric: tabular-nums; }
  .stn-row__mm small { font-size: var(--type-caption1-size); font-weight: var(--font-weight-regular); color: var(--color-fg-3); }
  .list-head { display: flex; flex-direction: column; gap: var(--space-12); padding: var(--space-16) var(--space-16) var(--space-12); border-bottom: var(--stroke-thin) solid var(--color-stroke-3); }
  .card--flush .list-row { background: transparent; }
  .list-foot { display: flex; justify-content: center; padding: var(--space-8) var(--space-16) var(--space-12); border-top: var(--stroke-thin) solid var(--color-stroke-3); }

  /* 1h rain grid (brand ramp tokens, light → dark = more rain) */
  .qpf-grid rect { stroke: var(--color-bg-1); stroke-width: 0.5; }
  .g-1 { fill: var(--color-brand-150); } .g-2 { fill: var(--color-brand-120); } .g-3 { fill: var(--color-brand-90); } .g-4 { fill: var(--color-brand-60); }
  .sw-1 { background: var(--color-brand-150); } .sw-2 { background: var(--color-brand-120); } .sw-3 { background: var(--color-brand-90); } .sw-4 { background: var(--color-brand-60); }
  .rain-hint { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .skel-line { height: var(--space-12); min-height: var(--space-12); }
  .skel-line--title { height: var(--space-48); width: 55%; }
  .skel-line--short { width: 40%; }
</style>
</head>

<main class="board">

<header class="board__head">
  <h1 class="text-title2">Team A · 雨量（觀測／預測）</h1>
  <p class="text-secondary">頁首分段控制切換「雨量觀測」與「降雨預測」，其下英雄卡顯示你所在地的關鍵數字，再往下是地圖與列表。警戒等級色：黃＝大雨、橙＝豪雨、紅＝大豪雨、紫＝超大豪雨，皆附文字。</p>
</header>

<section class="board__group" aria-labelledby="g-default">
  <h2 class="board__group-title" id="g-default">預設狀態與其他狀態</h2>
  <div class="frames">

  <!-- ================= Frame 1: observation (default) ================= -->
  <figure class="frame">
    <figcaption class="frame__caption">① 雨量觀測<span class="badge badge--brand">預設</span></figcaption>
    <div class="app-shell">
      <header class="app-bar">
        <div class="app-bar__titles">
          <p class="app-bar__title">雨量</p>
          <p class="app-bar__subtitle num"><svg class="icon icon--16" aria-hidden="true"><use href="#i-clock"/></svg>臺北市 信義區 · 觀測 14:10</p>
        </div>
        <div class="app-bar__actions">
          <button class="btn btn--subtle btn--icon" aria-label="重新整理"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
        </div>
      </header>
      <div class="page page--a">
        <div class="segmented segmented--block" role="tablist" aria-label="雨量檢視">
          <button class="segmented__item" role="tab" aria-selected="true">雨量觀測</button>
          <button class="segmented__item" role="tab" aria-selected="false">降雨預測</button>
        </div>

        <article class="card card--hero hero" aria-label="目前位置今日累積雨量">
          <div class="card__header card__header--top">
            <div class="hero__titles">
              <p class="hero__eyebrow"><span class="text-caption1 text-tertiary">最近測站 · 信義</span></p>
              <p class="hero__value"><span class="text-display num">86.5</span><span class="hero__unit">mm</span></p>
              <p class="card__meta num">今日累積 · 00:00 – 14:10</p>
            </div>
            <span class="badge badge--alert-1"><span class="level-dot level-dot--1"></span>大雨</span>
          </div>
          <div class="thr" aria-label="警戒門檻：已達大雨 80 毫米，距豪雨 200 毫米尚差 113.5 毫米">

              <div class="thr__bar" aria-hidden="true"><span class="lv-0"></span><span class="lv-1"></span><span class="lv-2"></span><span class="lv-3"></span></div>
              <span class="thr__marker" style="left:17.3%" aria-hidden="true"></span>
            </div>
            <div class="thr__labels" aria-hidden="true"><span>0</span><span>大雨 80</span><span>豪雨 200</span><span>大豪雨 350</span></div>
          </div>
          <div class="metric-grid">
            <div class="metric"><svg class="icon icon--20 text-tertiary" aria-hidden="true"><use href="#i-clock"/></svg><div><p class="metric__label">近 1 小時</p><p class="metric__value text-rain">12.0 mm</p></div></div>
            <div class="metric"><svg class="icon icon--20 text-tertiary" aria-hidden="true"><use href="#i-clock"/></svg><div><p class="metric__label">近 3 小時</p><p class="metric__value text-rain">28.5 mm</p></div></div>

          </div>
        </article>

        <article class="card card--a card--flush" aria-label="測站今日累積雨量">

            </div>
          </div>
          <div class="list-row stn-row">
            <span class="list-row__content"><span class="list-row__primary">火燒寮</span><span class="list-row__secondary">新北市 平溪區</span><span class="stn-row__bar"><span class="stn-row__fill lv-3" style="width:77.6%"></span></span></span>
            <span class="stn-row__value"><span class="stn-row__mm">388.0 <small>mm</small></span><span class="badge badge--alert-3"><span class="level-dot level-dot--3"></span>大豪雨</span></span>
          </div>
          <div class="list-row stn-row">
