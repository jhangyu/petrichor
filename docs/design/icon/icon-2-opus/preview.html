<style>
:root{--bg:#F4F6F9;--fg:#1B2633;--muted:#5B6878;--card:#FFFFFF}

p{margin:0 0 8px;color:var(--muted)}

.desk{border-radius:16px;padding:24px;display:flex;gap:24px}

label{display:inline-flex;gap:8px;align-items:center;cursor:pointer;margin-top:8px}
.strip{background:var(--card);border-radius:12px;padding:16px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.strip.dk{background:#1B2633} .strip.dk figcaption{color:#B4D6FA}
</style>

<p>A rain-drop echo cell painted in the CWA radar's own dBZ bands, sitting in a precise PPI scope just after the sweep has passed.</p>
