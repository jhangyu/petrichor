<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWA 天氣 — Team B 天氣主頁（密集清單）</title>
<!--
  Team B · home（天氣主頁）— concept "Dense information list": compact app bar + Fluent pivot tabs,
  full-bleed grouped lists / tables with stroke dividers, near-zero shadows, radius-sm or none.
  REFERENCE FILE for team-b: radar / warnings / rainfall / location copy the "TEAM B SHARED PATTERN"
  part of the <style> block (tb-header, tb-page, tb-section*, tb-group, tb-inset, tb-trow, frames).

  Functions covered (page-inventory.md §1.4 + §1.1 states + §3.5/§3.6 entries):
  - 位置標題：縣市＋鄉鎮區、定位狀態（目前位置／預設地點）、切換地點（標題點擊＋搜尋鈕 → location.html）
  - 最後更新時間（app bar 副標）＋各區塊資料時間（觀測時間、預報發布時間）
  - 重新整理按鈕＋下拉重新整理提示
  - 警特報入口（生效中/即將生效特報 → warnings.html）
  - 即時觀測：目前溫度、天氣現象（圖示隨現象變化）、體感溫度、相對濕度、風速＋風向、降雨機率、觀測時間／測站
  - 今日高低溫
  - 逐 3 小時預報：時間、天氣圖示＋文字、溫度、降雨機率（比例條）
  - 7 日預報：星期＋日期、天氣圖示、降雨機率、低溫／高溫＋溫度區間條
  - 雷達／雨量入口（底部導覽 5 頁：天氣、雷達、警特報、雨量、地點）
  - 狀態：載入中（骨架＋提示）、失敗（具體原因＋重試）、無資料（說明＋換地點／重新整理）、
    定位權限被拒（明示目前顯示預設地點＋開啟定位／選擇地點）
-->
<link rel="stylesheet" href="../tokens-fluent2-light.css">
<link rel="stylesheet" href="../components.css">
<style>
  /* ================= TEAM B SHARED PATTERN (copy to every team-b page) ================= */
  /* Mockup canvas: frames side by side, centred, wrap on narrow screens */
  .tb-doc { display: flex; flex-direction: column; align-items: center; gap: var(--space-24); padding: var(--space-24) var(--space-16) var(--space-64); background: var(--color-bg-4); min-height: 100vh; }
  .tb-doc__head { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: var(--space-4); }
  .tb-doc__title { font-size: var(--type-title3-size); line-height: var(--type-title3-lh); font-weight: var(--font-weight-semibold); color: var(--color-fg-1); }
  .tb-doc__note { font-size: var(--type-body1-size); line-height: var(--type-body1-lh); color: var(--color-fg-3); }
  .tb-frames { width: 100%; max-width: 1200px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: var(--space-32) var(--space-24); }
  .tb-frame { width: 100%; max-width: 375px; display: flex; flex-direction: column; gap: var(--space-8); margin: var(--space-0); }
  .tb-frame__caption { display: flex; align-items: center; gap: var(--space-8); font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-2); font-weight: var(--font-weight-semibold); }
  .tb-frame__no { display: inline-flex; align-items: center; justify-content: center; min-width: var(--size-icon-20); height: var(--size-icon-20); border-radius: var(--shape-extra-small); background: var(--color-fg-1); color: var(--color-fg-on-solid); font-variant-numeric: tabular-nums; }
  .tb-frame .app-shell { max-width: none; min-height: 0; background: var(--color-bg-3); border: var(--stroke-thin) solid var(--color-stroke-1); border-radius: var(--shape-medium); overflow: hidden; }

  /* Header = compact app bar + pivot tabs, one sticky block */
  .tb-header { position: sticky; top: var(--space-0); z-index: var(--z-appbar); background: var(--color-bg-1); border-bottom: var(--stroke-thin) solid var(--color-stroke-2); }
  .tb-header .app-bar { position: static; border-bottom: none; }
  .tb-header .tab-list { border-bottom: none; padding: var(--space-0) var(--space-4); }
  .tb-header .tab { text-decoration: none; }
  /* Location switcher inside app bar titles */
  .tb-loc { display: flex; flex-direction: column; min-width: 0; flex: 1; color: inherit; text-decoration: none; border-radius: var(--shape-extra-small); }
  .tb-loc__name { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
  .tb-loc__chev { transform: rotate(90deg); color: var(--color-fg-3); }
  .tb-loc:hover .app-bar__title { color: var(--color-brand-fg); }
  .tb-loc__meta { display: flex; align-items: center; gap: var(--space-4); font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); font-variant-numeric: tabular-nums; }
  .tb-loc__meta .icon { color: var(--color-brand-fg); }
  .tb-loc__meta--warn .icon { color: var(--color-warning-fg); }

  /* Page body: full-bleed groups, 16px gutter only for text/banners */
  .tb-page { flex: 1; display: flex; flex-direction: column; gap: var(--space-16); padding: var(--space-8) var(--space-0) var(--space-24); }
  .tb-inset { padding: var(--space-0) var(--space-16); display: flex; flex-direction: column; gap: var(--space-8); }
  .tb-section { display: flex; flex-direction: column; gap: var(--space-4); scroll-margin-top: calc(var(--size-appbar) + var(--size-touch) + var(--space-4)); }
  .tb-section__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); min-height: var(--size-control-sm); padding: var(--space-0) var(--space-16); }
  .tb-section__title { font-size: var(--type-body1-size); line-height: var(--type-body1-lh); font-weight: var(--font-weight-semibold); color: var(--color-fg-1); }
  .tb-section__meta { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); font-variant-numeric: tabular-nums; }
  .tb-group { display: flex; flex-direction: column; background: var(--color-bg-1); border-top: var(--stroke-thin) solid var(--color-stroke-2); border-bottom: var(--stroke-thin) solid var(--color-stroke-2); }
  .tb-group > * + * { border-top: var(--stroke-thin) solid var(--color-stroke-3); }
  .tb-group .list-row + .list-row { border-top-color: var(--color-stroke-3); }
  .tb-group__foot { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-8) var(--space-16); font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  /* Table row: grid columns, every cell vertically centred */
  .tb-trow { display: grid; align-items: center; column-gap: var(--space-8); min-height: var(--size-touch); padding: var(--space-8) var(--space-16); font-size: var(--type-body1-size); line-height: var(--type-body1-lh); color: var(--color-fg-1); font-variant-numeric: tabular-nums; }
  .tb-trow--head { min-height: var(--size-control-sm); padding-top: var(--space-4); padding-bottom: var(--space-4); background: var(--color-bg-2); font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .tb-trow--now { background: var(--color-brand-bg-subtle); }
  .tb-cell-wx { display: flex; align-items: center; gap: var(--space-8); min-width: 0; }
  .tb-cell-wx span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb-end { text-align: right; }
  /* ================= /TEAM B SHARED PATTERN ================= */

  /* ---------- home-only ---------- */
  .tb-ptr { display: flex; align-items: center; justify-content: center; gap: var(--space-4); min-height: var(--size-icon-24); font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .tb-ptr .icon { transform: rotate(-90deg); }

  .tb-alert { background: var(--color-alert-1-bg); }
  a.tb-alert:hover { background: var(--color-alert-1-bg); }
  .tb-alert .list-row__leading { color: var(--color-alert-1-fg); }
  .tb-alert .list-row__primary { display: flex; align-items: center; gap: var(--space-8); }
  .tb-group > .tb-alert { border-top: none; }
  .tb-group--alert { border-color: var(--color-alert-1-stroke); }

  /* Current observation */
  .tb-now { display: grid; grid-template-columns: auto auto 1fr; align-items: center; column-gap: var(--space-12); padding: var(--space-16); }
  .tb-now__temp { font-family: var(--font-family-display); font-size: var(--type-large-title-size); line-height: var(--type-large-title-lh); font-weight: var(--font-weight-semibold); color: var(--color-fg-1); font-variant-numeric: tabular-nums; }
  .tb-now__desc { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-4); text-align: right; }
  .tb-now__wx { font-size: var(--type-body2-size); line-height: var(--type-body2-lh); font-weight: var(--font-weight-semibold); }
  .tb-hilo { display: inline-flex; align-items: center; gap: var(--space-4); font-size: var(--type-body1-size); line-height: var(--type-body1-lh); color: var(--color-fg-2); font-variant-numeric: tabular-nums; }
  .tb-hilo b { font-weight: var(--font-weight-semibold); }

  .tb-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tb-metric { display: flex; align-items: center; gap: var(--space-12); min-height: 56px; padding: var(--space-8) var(--space-16); min-width: 0; }
  .tb-metric:nth-child(n+3) { border-top: var(--stroke-thin) solid var(--color-stroke-3); }
  .tb-metric:nth-child(even) { border-left: var(--stroke-thin) solid var(--color-stroke-3); }
  .tb-metric > .icon { color: var(--color-fg-3); }
  .tb-metric__body { display: flex; flex-direction: column; min-width: 0; }
  .tb-metric__label { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .tb-metric__value { font-size: var(--type-body2-size); line-height: var(--type-body2-lh); font-weight: var(--font-weight-semibold); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tb-metric__value small { font-size: var(--type-caption1-size); font-weight: var(--font-weight-regular); color: var(--color-fg-2); }

  /* Hourly table: 時間 | 天氣 | 溫度 | 降雨 */
  .tb-hourly .tb-trow { grid-template-columns: 48px minmax(0, 1fr) 40px 96px; }
  .tb-rain { display: grid; grid-template-columns: minmax(0, 1fr) 32px; align-items: center; column-gap: var(--space-8); color: var(--color-rain-fg); }
  .tb-rain__bar { height: var(--size-slider-track); border-radius: var(--shape-full); background: var(--color-rain-bar-track); overflow: hidden; }
  .tb-rain__bar i { display: block; height: 100%; background: var(--color-rain-bar); border-radius: var(--shape-full); }
  .tb-rain__pct { text-align: right; font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); font-weight: var(--font-weight-semibold); }

  /* Weekly table: 日期 | 天氣 | 降雨 | 低 | 區間 | 高 */
  .tb-weekly .tb-trow { grid-template-columns: 64px 24px 40px 28px minmax(0, 1fr) 28px; }
  .tb-day { display: flex; flex-direction: column; }
  .tb-day__name { font-weight: var(--font-weight-semibold); }
  .tb-day__date { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); color: var(--color-fg-3); }
  .tb-pop { font-size: var(--type-caption1-size); line-height: var(--type-caption1-lh); font-weight: var(--font-weight-semibold); color: var(--color-rain-fg); text-align: right; }
  .tb-pop--nil { color: var(--color-fg-4); font-weight: var(--font-weight-regular); }
  .tb-lo { color: var(--color-temp-cold); text-align: right; }
  .tb-hi { color: var(--color-temp-hot); font-weight: var(--font-weight-semibold); }

  /* State frames */
  .tb-skel-row { display: flex; align-items: center; gap: var(--space-12); min-height: var(--size-touch); padding: var(--space-8) var(--space-16); }
  .tb-skel-row .skeleton { flex: 1; }
  .tb-skel-row .skeleton--short { flex: none; width: 48px; }
  .tb-skel-row .skeleton--icon { flex: none; width: var(--size-icon-24); height: var(--size-icon-24); min-height: 0; border-radius: var(--shape-full); }
  .tb-skel-big { height: var(--type-large-title-lh); width: 96px; flex: none; }
  .tb-dim { opacity: 0.4; }
</style>
</head>

<main class="tb-doc">
  <header class="tb-doc__head">
    <h1 class="tb-doc__title">Team B · 天氣主頁</h1>
    <p class="tb-doc__note">密集清單版：精簡標題列＋分頁籤，內容為滿版分組清單與表格，以分隔線取代卡片陰影，一屏可掃完即時觀測、逐 3 小時與 7 日預報。</p>
  </header>

  <div class="tb-frames">

    <!-- ===================== 1. Default (data) ===================== -->
    <figure class="tb-frame">
      <figcaption class="tb-frame__caption"><span class="tb-frame__no">1</span>預設：有資料</figcaption>
      <div class="app-shell">
        <div class="tb-header">
          <header class="app-bar">
            <a class="tb-loc" href="location.html" aria-label="切換地點，目前：臺北市 信義區">
              <span class="tb-loc__name"><h2 class="app-bar__title">臺北市 信義區</h2><svg class="icon icon--16 tb-loc__chev" aria-hidden="true"><use href="#i-chevron"/></svg></span>
              <span class="tb-loc__meta"><svg class="icon icon--16" aria-hidden="true"><use href="#i-locate"/></svg>目前位置 · 更新於 14:10</span>
            </a>
            <div class="app-bar__actions">
              <button class="btn btn--subtle btn--icon" aria-label="重新整理"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
              <a class="btn btn--subtle btn--icon" href="location.html" aria-label="搜尋地點"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg></a>
            </div>
          </header>
          <nav class="tab-list tab-list--stretch" role="tablist" aria-label="天氣內容">
            <a class="tab" role="tab" href="#now" aria-selected="true">即時</a>
            <a class="tab" role="tab" href="#hourly" aria-selected="false">逐 3 小時</a>
            <a class="tab" role="tab" href="#weekly" aria-selected="false">7 日</a>
          </nav>
        </div>

        <div class="tb-page">
          <p class="tb-ptr"><svg class="icon icon--16" aria-hidden="true"><use href="#i-back"/></svg>下拉即可重新整理</p>

          <!-- Warning entry -->
          <div class="tb-group tb-group--alert">
            <a class="list-row tb-alert" href="warnings.html">
              <span class="list-row__leading"><svg class="icon" aria-hidden="true"><use href="#i-warning"/></svg></span>
              <span class="list-row__content">
                <span class="list-row__primary">大雨特報<span class="badge badge--alert-1">18:00 起</span></span>
                <span class="list-row__secondary num">臺北市、新北市、基隆市 · 至 11/15 06:00</span>
              </span>
              <span class="list-row__trailing"><svg class="icon icon--20" aria-hidden="true"><use href="#i-chevron"/></svg></span>
            </a>
          </div>

          <!-- Current observation -->
          <section class="tb-section" id="now">
            <div class="tb-section__head"><h3 class="tb-section__title">即時觀測</h3><span class="tb-section__meta">信義站 · 14:00 觀測</span></div>
            <div class="tb-group">
              <div class="tb-now">
                <svg class="icon icon--48 icon--sun" aria-hidden="true"><use href="#i-partly"/></svg>
                <span class="tb-now__temp">28°</span>
                <div class="tb-now__desc">
                  <span class="tb-now__wx">多雲時晴</span>
                  <span class="tb-hilo">今日 <b class="text-temp-cold">24°</b>/<b class="text-temp-hot">29°</b></span>
