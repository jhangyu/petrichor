<!--
  Team B「Dense information list」— 定位權限引導＋地點選擇 (location)
  Functions covered (page-inventory §3.2 定位權限流程, §3.7 地點管理, §0 定位, §1.4 定位狀態與手動選地點):
   1. 首次使用說明頁（為何需要位置、隱私說明、允許使用位置／手動選擇）
   2. 權限被拒絕橫幅「未取得位置權限，目前顯示臺北市 信義區」＋「前往設定」＋手動選擇入口
   3. 永久拒絕（deniedForever）狀態：說明系統設定步驟＋「前往設定」＋改用手動
   4. 手動選縣市（22 縣市分區列表，目前選取標示）＋搜尋
   5. 手動選鄉鎮市區（含搜尋過濾、選取後套用）
   6. 已存地點列表（各地點即時溫度/天氣、目前選取標示、新增/移除）
   7. 目前位置列（GPS 定位來源、重新定位）
   8. 載入中（定位中骨架）／失敗（定位逾時、地理編碼失敗）＋重試／手動選擇
   9. 底部導覽 5 頁（目前頁＝地點），頁面間可點擊
  Frames: 1 首次說明 / 2 已存地點（預設）/ 3 權限被拒 / 4 永久拒絕 / 5 選縣市 / 6 選鄉鎮＋搜尋 / 7 定位中 / 8 定位失敗
-->
